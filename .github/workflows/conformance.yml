name: SDK Conformance

on:
  push:
    paths:
      - 'packages/protocol/test-vectors/**'
      - 'packages/sdks/typescript/src/**'
      - 'packages/sdks/rust/src/**'
      - 'packages/sdks/python/sekuire_sdk/**'
  pull_request:
    paths:
      - 'packages/protocol/test-vectors/**'
      - 'packages/sdks/typescript/src/**'
      - 'packages/sdks/rust/src/**'
      - 'packages/sdks/python/sekuire_sdk/**'

jobs:
  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm -C packages/sdks/typescript install --frozen-lockfile
      - run: pnpm -C packages/sdks/typescript build
      - run: pnpm -C packages/sdks/typescript test

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p sekuire-sdk
      - run: cargo test -p sekuire-sdk

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - working-directory: packages/sdks/python
        run: uv sync --dev
      - working-directory: packages/sdks/python
        run: uv run pytest -q tests/ -x
