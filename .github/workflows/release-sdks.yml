name: Release TypeScript SDK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease

permissions:
  contents: write
  packages: write

jobs:
  publish-typescript-sdk:
    name: Publish TypeScript SDK to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump Package Version
        run: |
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "TS_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Validate Release Candidate
        run: node scripts/release-preflight.mjs

      - name: Commit Version Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): TypeScript SDK v${{ env.TS_VERSION }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD

      - name: Create Git Tag
        run: |
          git tag -a "ts-sdk-v${{ env.TS_VERSION }}" -m "TypeScript SDK v${{ env.TS_VERSION }}"
          git push origin "ts-sdk-v${{ env.TS_VERSION }}"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Post-publish Smoke Check
        run: node scripts/release-preflight.mjs --mode=postpublish --version="${{ env.TS_VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "ts-sdk-v${{ env.TS_VERSION }}"
          name: "TypeScript SDK v${{ env.TS_VERSION }}"
          body: |
            ## TypeScript SDK Release

            ### Installation

            ```bash
            npm install @sekuire/sdk@${{ env.TS_VERSION }}
            ```

            ### Validation

            - `pnpm run release:preflight`
            - `pnpm run release:smoke:npm -- --version=${{ env.TS_VERSION }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
